<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Section Style Options</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#101828;--muted:#5B6472;--green:#4F8A10}
body{margin:0;background:#E9EDE6;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.w{max-width:1560px;margin:0 auto;padding:36px 24px 60px}
h1{font-family:"Instrument Sans";font-size:30px;margin:0 0 6px}.lead{color:var(--muted);margin:0 0 28px;max-width:900px}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;align-items:start}
.o{margin:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px -18px rgba(0,0,0,.3)}
.o.pick{outline:3px solid var(--green)}.o.pick figcaption span{background:#101828}
figcaption{display:flex;gap:10px;padding:14px 14px 12px;align-items:flex-start;min-height:118px}
figcaption span{flex:0 0 26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
figcaption b{display:block;font-family:"Instrument Sans";font-size:15.5px}figcaption p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.o img{display:block;width:100%;height:auto;border-top:1px solid #E4E9E1}
@media(max-width:1200px){.g{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.g{grid-template-columns:1fr}}
</style></head><body><div class="w"><h1>Chapter style options, round 2</h1><p class="lead">Five variations built on option C, which you picked, shown next to C itself. Each screenshot is the real page, chapters 01 to 07, with only the backgrounds changed.</p><div class="g"><figure class="o pick"><figcaption><span>C</span><div><b>Your pick: dark money chapters</b><p>White page. Cost and comparison go full-width dark like the banner.</p></div></figcaption><img src="img/C.jpg" alt="Option C"></figure><figure class="o"><figcaption><span>F</span><div><b>Dark money panels</b><p>Same idea as C, but the two dark chapters are rounded panels floating on the white page, not full-width bands.</p></div></figcaption><img src="img/F.jpg" alt="Option F"></figure><figure class="o"><figcaption><span>G</span><div><b>Dark with banner glow and grid</b><p>C with the banner's green glow and faint grid carried into the dark chapters, so they feel like the banner returning.</p></div></figcaption><img src="img/G.jpg" alt="Option G"></figure><figure class="o"><figcaption><span>H</span><div><b>Warm off-white plus dark money</b><p>A warm off-white page instead of pure white, with the two dark money chapters. Softer and more premium than C.</p></div></figcaption><img src="img/H.jpg" alt="Option H"></figure><figure class="o"><figcaption><span>I</span><div><b>Dark money plus one sage accent</b><p>C, plus a single soft green band on the compliance chapter to flag the no-penalty promise. Three tones, used sparingly.</p></div></figcaption><img src="img/I.jpg" alt="Option I"></figure><figure class="o"><figcaption><span>J</span><div><b>Floating panels plus dark money</b><p>Every chapter is a white rounded panel on a soft sage page, and the two money panels are dark.</p></div></figcaption><img src="img/J.jpg" alt="Option J"></figure></div></div><script src="../../assets/protect.js" defer></script></body></html>
